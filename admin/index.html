<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>POWER LINE — Owner Admin</title>
<style>
:root{color-scheme:dark;--bg:#100d0d;--panel:#211817;--line:#493633;--gold:#e9b86b;--text:#f7eee9;--muted:#c2aaa1}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#38221e,#100d0d 55%);color:var(--text);font:16px/1.5 system-ui,Arial,sans-serif}.wrap{max-width:900px;margin:auto;padding:28px 18px}.brand{font-weight:900;letter-spacing:.12em;color:var(--gold)}h1{margin:8px 0 4px}p{color:var(--muted)}.panel{background:#1c1514;border:1px solid var(--line);border-radius:18px;padding:22px;margin:18px 0;box-shadow:0 16px 50px #0006}label{display:block;margin:12px 0;color:var(--muted)}input,textarea,select{width:100%;margin-top:6px;padding:12px;border:1px solid var(--line);border-radius:10px;background:#100d0d;color:var(--text)}button,.btn{border:0;border-radius:10px;padding:12px 17px;background:var(--gold);color:#21130e;font-weight:800;cursor:pointer}button:disabled{opacity:.5}.secondary{background:#40302d;color:var(--text)}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:space-between}.plugin{border:1px solid var(--line);border-radius:12px;padding:14px;margin:12px 0}.plugin small{color:var(--muted)}.hidden{display:none!important}#msg{min-height:24px;color:var(--gold)}a{color:var(--gold)}
</style></head><body><main class="wrap"><div class="brand">POWER LINE</div><h1>Owner Admin Panel</h1><p>Private management area. Only the authenticated owner can make changes.</p>
<section id="login" class="panel"><h2>Secure Owner Login</h2><form id="loginForm"><label>Owner email<input name="email" type="email" autocomplete="username" required maxlength="254"></label><label>Password<input name="password" type="password" autocomplete="current-password" required maxlength="200"></label><button>LOGIN</button></form></section>
<section id="dash" class="hidden"><div class="panel"><div class="row"><h2>Upload a plugin</h2><button id="logout" class="secondary">LOG OUT</button></div><form id="uploadForm"><label>Plugin name<input name="name" required maxlength="100"></label><label>Description<textarea name="description" required maxlength="1200" rows="3"></textarea></label><label>Version<input name="version" required maxlength="30" placeholder="1.0.0"></label><label>Release type<select name="status"><option value="draft">Save as draft</option><option value="published">Publish now</option><option value="pre-release">Publish as pre-release</option></select></label><label>Plugin image<input name="image" type="file" accept="image/png,image/jpeg,image/webp" required></label><label>Plugin ZIP<input name="zip" type="file" accept=".zip,application/zip" required></label><button id="uploadBtn">SAVE PLUGIN</button></form></div>
<div class="panel"><h2>Manage plugins</h2><div id="plugins">Loading…</div></div></section><p id="msg" role="status" aria-live="polite"></p><p><a href="/">← Back to public website</a></p></main>
<script>
const $=s=>document.querySelector(s),msg=t=>$('#msg').textContent=t;
async function api(path,opts={}){const r=await fetch('/api'+path,{credentials:'same-origin',...opts});let d={};try{d=await r.json()}catch{}if(!r.ok)throw Error(d.message||`Request failed (${r.status})`);return d}
function show(owner){$('#login').classList.toggle('hidden',owner);$('#dash').classList.toggle('hidden',!owner);if(owner)load();}
async function check(){try{const d=await api('/auth/me');show(d.owner===true)}catch{show(false)}}
$('#loginForm').addEventListener('submit',async e=>{e.preventDefault();const b=e.submitter;b.disabled=true;msg('Checking login…');try{await api('/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(Object.fromEntries(new FormData(e.currentTarget)))});e.currentTarget.reset();msg('Logged in.');show(true)}catch(err){msg(err.message)}finally{b.disabled=false}});
$('#logout').onclick=async()=>{try{await api('/auth/logout',{method:'POST'})}catch{}show(false);msg('Logged out.')};
$('#uploadForm').addEventListener('submit',async e=>{e.preventDefault();const b=$('#uploadBtn');b.disabled=true;msg('Uploading…');try{const d=await api('/admin/plugins',{method:'POST',body:new FormData(e.currentTarget)});msg(d.message||'Saved.');e.currentTarget.reset();load()}catch(err){msg(err.message)}finally{b.disabled=false}});
async function load(){try{const d=await api('/admin/plugins');const box=$('#plugins');box.replaceChildren();for(const p of d.plugins||[]){const el=document.createElement('article');el.className='plugin';const h=document.createElement('h3');h.textContent=p.name;const sm=document.createElement('small');sm.textContent=`${p.version} · ${p.status}`;const actions=document.createElement('div');actions.className='row';const edit=document.createElement('button');edit.className='secondary';edit.textContent='EDIT DETAILS';edit.onclick=()=>editPlugin(p);const toggle=document.createElement('button');toggle.className='secondary';toggle.textContent=p.status==='published'?'UNPUBLISH':'PUBLISH';toggle.onclick=()=>mutate(p.id,'publish',{status:p.status==='published'?'draft':'published'});const del=document.createElement('button');del.className='secondary';del.textContent='DELETE';del.onclick=()=>{if(confirm('Delete this plugin?'))mutate(p.id,'delete')};actions.append(edit,toggle,del);el.append(h,sm,actions);box.append(el)}if(!box.children.length)box.textContent='No plugins yet.'}catch(err){msg(err.message)}}
async function editPlugin(p){const name=prompt('Plugin name:',p.name);if(name===null)return;const description=prompt('Plugin description:',p.description||'');if(description===null)return;const version=prompt('Plugin version:',p.version);if(version===null)return;try{await api(`/admin/plugins/${encodeURIComponent(p.id)}`,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({name,description,version})});msg('Plugin details updated.');load()}catch(e){msg(e.message)}}
async function mutate(id,action,data){try{await api(`/admin/plugins/${encodeURIComponent(id)}`,{method:action==='delete'?'DELETE':'PATCH',headers:{'Content-Type':'application/json'},body:action==='delete'?undefined:JSON.stringify(data)});msg('Updated.');load()}catch(e){msg(e.message)}}
check();
</script></body></html>
